version: "3.9"

services:
  # ── Databases ──────────────────────────────────────────────────────────────
  postgres:
    image: supabase/postgres:15.1.0.117
    environment:
      POSTGRES_USER: eyeofabyss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: eyeofabyss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyeofabyss"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.19.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migrations + Seed (one-shot) ───────────────────────────────────────────
  migrate:
    build:
      context: ../services/case-engine
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eyeofabyss
      PYTHONPATH: /shared:/app
    volumes:
      - ../shared:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic -c alembic.ini upgrade head &&
             python /app/../../scripts/seed.py || true"
    restart: "no"

  # ── Backend Services ───────────────────────────────────────────────────────
  case-engine:
    build:
      context: ../services/case-engine
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eyeofabyss
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      EVIDENCE_REGISTRY_ADDRESS: ${EVIDENCE_REGISTRY_ADDRESS:-}
      PINATA_API_KEY: ${PINATA_API_KEY:-}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PYTHONPATH: /shared:/app
    volumes:
      - ../shared:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  case-engine-worker:
    build:
      context: ../services/case-engine
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eyeofabyss
      REDIS_URL: redis://redis:6379
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      EVIDENCE_REGISTRY_ADDRESS: ${EVIDENCE_REGISTRY_ADDRESS:-}
      PINATA_API_KEY: ${PINATA_API_KEY:-}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY:-}
      PYTHONPATH: /shared:/app
    volumes:
      - ../shared:/shared:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A tasks.celery_app worker --loglevel=info

  voiceguard:
    build:
      context: ../services/voiceguard
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eyeofabyss
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PYTHONPATH: /shared:/app
    volumes:
      - ../shared:/shared:ro
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  shadowtrace:
    build:
      context: ../services/shadowtrace
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eyeofabyss
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PYTHONPATH: /shared:/app
    volumes:
      - ../shared:/shared:ro
    depends_on:
      - postgres
      - neo4j
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8002

  chaineye:
    build:
      context: ../services/chaineye
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eyeofabyss
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      BLOCKSTREAM_API_KEY: ${BLOCKSTREAM_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PYTHONPATH: /shared:/app
    volumes:
      - ../shared:/shared:ro
    depends_on:
      - postgres
      - neo4j
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8003

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CASE_ENGINE_URL: http://localhost:8000
      NEXT_PUBLIC_VOICEGUARD_URL: http://localhost:8001
      NEXT_PUBLIC_SHADOWTRACE_URL: http://localhost:8002
      NEXT_PUBLIC_CHAINEYE_URL: http://localhost:8003
    depends_on:
      - case-engine

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - case-engine
      - voiceguard
      - shadowtrace
      - chaineye

volumes:
  postgres_data:
  neo4j_data:
  minio_data:
