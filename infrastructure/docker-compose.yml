version: "3.9"

services:
  # ── Databases ──────────────────────────────────────────────────────────────
  postgres:
    image: supabase/postgres:15.1.0.117
    environment:
      POSTGRES_USER: eyeofabyss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: eyeofabyss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyeofabyss"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.19.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Services ───────────────────────────────────────────────────────
  case-engine:
    build:
      context: ../services/case-engine
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eyeofabyss
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379
      POLYGON_RPC_URL: ${POLYGON_RPC_URL}
      PRIVATE_KEY: ${PRIVATE_KEY}
      EVIDENCE_REGISTRY_ADDRESS: ${EVIDENCE_REGISTRY_ADDRESS}
      PINATA_API_KEY: ${PINATA_API_KEY}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  voiceguard:
    build:
      context: ../services/voiceguard
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eyeofabyss
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  shadowtrace:
    build:
      context: ../services/shadowtrace
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eyeofabyss
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - neo4j
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8002

  chaineye:
    build:
      context: ../services/chaineye
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-changeme}@postgres:5432/eyeofabyss
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY}
      BLOCKSTREAM_API_KEY: ${BLOCKSTREAM_API_KEY}
    depends_on:
      - postgres
      - neo4j
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8003

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CASE_ENGINE_URL: http://localhost:8000
      NEXT_PUBLIC_VOICEGUARD_URL: http://localhost:8001
      NEXT_PUBLIC_SHADOWTRACE_URL: http://localhost:8002
      NEXT_PUBLIC_CHAINEYE_URL: http://localhost:8003
    depends_on:
      - case-engine

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - case-engine
      - voiceguard
      - shadowtrace
      - chaineye

volumes:
  postgres_data:
  neo4j_data:
