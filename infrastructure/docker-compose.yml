version: "3.9"

networks:
  app_tier:
    driver: bridge
  db_tier:
    internal: true

services:
  # ── Databases & Persistence (Isolated on db_tier, no host ports) ───────────
  postgres:
    image: supabase/postgres:15.1.0.117
    environment:
      POSTGRES_USER: eyeofabyss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eob_dev_pg_pass_32chars_long!}
      POSTGRES_DB: eyeofabyss
    networks:
      - db_tier
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyeofabyss"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.19.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-eob_dev_neo4j_pass_32chars_long!}
      NEO4J_PLUGINS: '["apoc"]'
    networks:
      - db_tier
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-eob_dev_redis_pass_32chars!}"
    networks:
      - db_tier
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-eob_dev_redis_pass_32chars!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eob_dev_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eob_dev_minio_root_pass_32chars!}
    networks:
      - db_tier
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migrations + Seed (one-shot) ───────────────────────────────────────────
  migrate:
    build:
      context: ../services/case-engine
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-eob_dev_pg_pass_32chars_long!}@postgres:5432/eyeofabyss
      PYTHONPATH: /shared:/app
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@eyeofabyss.local}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-eob-dev-owner-pass-32-chars-long!}
    networks:
      - app_tier
      - db_tier
    volumes:
      - ../shared:/shared:ro
      - ../scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic -c alembic.ini upgrade head &&
             python /scripts/seed.py || true"
    restart: "no"

  # ── Backend Services (Protected behind Nginx, routed on app_tier) ─────────
  case-engine:
    build:
      context: ../services/case-engine
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-eob_dev_pg_pass_32chars_long!}@postgres:5432/eyeofabyss
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-eob_dev_neo4j_pass_32chars_long!}
      REDIS_URL: redis://:${REDIS_PASSWORD:-eob_dev_redis_pass_32chars!}@redis:6379/0
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      EVIDENCE_REGISTRY_ADDRESS: ${EVIDENCE_REGISTRY_ADDRESS:-}
      PINATA_API_KEY: ${PINATA_API_KEY:-}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-eob-dev-secret-minimum-32-chars-long-jwt_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-eob-dev-secret-minimum-32-chars-long-refresh}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eob_dev_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eob_dev_minio_root_pass_32chars!}
      PYTHONPATH: /shared:/app
    networks:
      - app_tier
      - db_tier
    volumes:
      - ../shared:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  case-engine-worker:
    build:
      context: ../services/case-engine
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-eob_dev_pg_pass_32chars_long!}@postgres:5432/eyeofabyss
      REDIS_URL: redis://:${REDIS_PASSWORD:-eob_dev_redis_pass_32chars!}@redis:6379/0
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      EVIDENCE_REGISTRY_ADDRESS: ${EVIDENCE_REGISTRY_ADDRESS:-}
      PINATA_API_KEY: ${PINATA_API_KEY:-}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY:-}
      PYTHONPATH: /shared:/app
    networks:
      - app_tier
      - db_tier
    volumes:
      - ../shared:/shared:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A tasks.celery_app worker --loglevel=info

  voiceguard:
    build:
      context: ../services/voiceguard
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-eob_dev_pg_pass_32chars_long!}@postgres:5432/eyeofabyss
      REDIS_URL: redis://:${REDIS_PASSWORD:-eob_dev_redis_pass_32chars!}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-eob-dev-secret-minimum-32-chars-long-jwt_secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eob_dev_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eob_dev_minio_root_pass_32chars!}
      PYTHONPATH: /shared:/app
    networks:
      - app_tier
      - db_tier
    volumes:
      - ../shared:/shared:ro
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  shadowtrace:
    build:
      context: ../services/shadowtrace
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-eob_dev_pg_pass_32chars_long!}@postgres:5432/eyeofabyss
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-eob_dev_neo4j_pass_32chars_long!}
      REDIS_URL: redis://:${REDIS_PASSWORD:-eob_dev_redis_pass_32chars!}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-eob-dev-secret-minimum-32-chars-long-jwt_secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eob_dev_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eob_dev_minio_root_pass_32chars!}
      PYTHONPATH: /shared:/app
    networks:
      - app_tier
      - db_tier
    volumes:
      - ../shared:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8002

  chaineye:
    build:
      context: ../services/chaineye
    environment:
      DATABASE_URL: postgresql://eyeofabyss:${POSTGRES_PASSWORD:-eob_dev_pg_pass_32chars_long!}@postgres:5432/eyeofabyss
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-eob_dev_neo4j_pass_32chars_long!}
      REDIS_URL: redis://:${REDIS_PASSWORD:-eob_dev_redis_pass_32chars!}@redis:6379/0
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      BLOCKSTREAM_API_KEY: ${BLOCKSTREAM_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-eob-dev-secret-minimum-32-chars-long-jwt_secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eob_dev_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eob_dev_minio_root_pass_32chars!}
      PYTHONPATH: /shared:/app
    networks:
      - app_tier
      - db_tier
    volumes:
      - ../shared:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8003

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CASE_ENGINE_URL: http://localhost/api/cases
      NEXT_PUBLIC_VOICEGUARD_URL: http://localhost/api/voice
      NEXT_PUBLIC_SHADOWTRACE_URL: http://localhost/api/shadow
      NEXT_PUBLIC_CHAINEYE_URL: http://localhost/api/chain
    networks:
      - app_tier
    depends_on:
      - case-engine
      - nginx

  # ── Reverse Proxy (Only public gateway) ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    networks:
      - app_tier
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - case-engine
      - voiceguard
      - shadowtrace
      - chaineye

volumes:
  postgres_data:
  neo4j_data:
  minio_data:
