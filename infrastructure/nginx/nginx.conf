events { worker_connections 1024; }

http {
    upstream frontend    { server frontend:3000; }
    upstream case_engine { server case-engine:8000; }
    upstream voiceguard  { server voiceguard:8001; }
    upstream shadowtrace { server shadowtrace:8002; }
    upstream chaineye    { server chaineye:8003; }

    server {
        listen 80;

        location /api/cases    { proxy_pass http://case_engine; }
        location /api/voice    { proxy_pass http://voiceguard; }
        location /api/shadow   { proxy_pass http://shadowtrace; }
        location /api/chain    { proxy_pass http://chaineye; }
        location /             { proxy_pass http://frontend; }
    }
}
