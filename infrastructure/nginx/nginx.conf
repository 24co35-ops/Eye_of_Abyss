events { worker_connections 1024; }

http {
    upstream frontend    { server frontend:3000; }
    upstream case_engine { server case-engine:8000; }
    upstream voiceguard  { server voiceguard:8001; }
    upstream shadowtrace { server shadowtrace:8002; }
    upstream chaineye    { server chaineye:8003; }

    server {
        listen 80;

        # API routes — strip the /api/<module> prefix and proxy to each service.
        # The browser always calls http://localhost/api/* so it stays same-origin.
        location /api/cases  { proxy_pass http://case_engine; proxy_set_header Host $host; }
        location /api/voice  { proxy_pass http://voiceguard;  proxy_set_header Host $host; }
        location /api/shadow { proxy_pass http://shadowtrace; proxy_set_header Host $host; }
        location /api/chain  { proxy_pass http://chaineye;    proxy_set_header Host $host; }

        # Health / readiness endpoints — exposed directly for monitoring
        location /health/cases  { proxy_pass http://case_engine/health; }
        location /health/voice  { proxy_pass http://voiceguard/health; }
        location /health/shadow { proxy_pass http://shadowtrace/health; }
        location /health/chain  { proxy_pass http://chaineye/health; }

        # Everything else → Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
