# Eye of Abyss — Hardened Production Nginx Configuration
# Enforces TLSv1.2/1.3, strict security headers, and request body size limits.

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hardened payload limit (prevents DoS via unbounded payloads)
    client_max_body_size 50M;

    # Upstreams targeting internal microservices
    upstream frontend    { server frontend:3000; }
    upstream case_engine { server case-engine:8000; }
    upstream voiceguard  { server voiceguard:8001; }
    upstream shadowtrace { server shadowtrace:8002; }
    upstream chaineye    { server chaineye:8003; }

    # Redirect all plain HTTP traffic to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # TLS Termination
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Comprehensive Production Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:;" always;

        # API routes — stripped prefixes routed to respective microservices
        location /api/cases/ {
            proxy_pass http://case_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /api/cases {
            return 301 /api/cases/;
        }

        location /api/voice/ {
            proxy_pass http://voiceguard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location = /api/voice {
            return 301 /api/voice/;
        }

        location /api/shadow/ {
            proxy_pass http://shadowtrace/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /api/shadow {
            return 301 /api/shadow/;
        }

        location /api/chain/ {
            proxy_pass http://chaineye/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /api/chain {
            return 301 /api/chain/;
        }

        # Health / readiness endpoints
        location /health/cases  { proxy_pass http://case_engine/health; }
        location /health/voice  { proxy_pass http://voiceguard/health; }
        location /health/shadow { proxy_pass http://shadowtrace/health; }
        location /health/chain  { proxy_pass http://chaineye/health; }

        # Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
