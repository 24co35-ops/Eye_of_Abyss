[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-of-abyss-shared"
version = "0.1.0"
description = "Shared schemas, types and utilities for Eye of Abyss"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
