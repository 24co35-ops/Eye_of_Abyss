name: Eye of Abyss CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    name: Backend Unit Tests & Data Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pydantic numpy pandas networkx faker python-jose passlib bcrypt pyjwt
          pip install -r services/case-engine/requirements.txt || true
          pip install -r services/voiceguard/requirements.txt || true
          pip install -r services/shadowtrace/requirements.txt || true
          pip install -r services/chaineye/requirements.txt || true
          pip install -r data-pipeline/requirements.txt || true

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Run Data Pipeline Generator
        run: |
          python data-pipeline/main.py generate --count 50 --output-dir ./output

      - name: Run Demo Verification Pipeline
        run: |
          python scripts/demo_pipeline.py

      - name: Run Polygon Anchoring Test
        run: |
          python scripts/anchor_test.py

  build-frontend:
    name: Next.js Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck Frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build
